<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>กระบวนการรับชำระเงินจากลูกค้า — นำโชคอิเล็กทริก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f5f5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--paper);
    min-height:100%;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .diagram-container{
    width:100%;
    max-width:1260px;
  }
  svg{display:block;width:100%;height:auto;}
</style>
</head>
<body>
  <div class="diagram-container">
<svg viewBox="0 0 1260 760" role="img" aria-labelledby="cashflow-title cashflow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cashflow-title">กระบวนการรับชำระเงินและตัดบัญชีลูกหนี้ นำโชคอิเล็กทริก</title>
  <desc id="cashflow-desc">แผนผังสวิมเลนสามช่องแสดงขั้นตอนรับชำระเงินจากลูกค้า ตั้งแต่การเก็บเงินโดยพนักงานขายหรือการชำระทางไปรษณีย์และโอนเงิน จนถึงการบันทึกตัดบัญชีลูกหนี้ โดยเน้นจุดเสี่ยงที่พนักงานขายถือเงินสดและเช็คไว้เองระหว่างออกตลาดต่างจังหวัดนานเกือบหนึ่งเดือนก่อนนำส่งบัญชี</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1260" height="760" fill="#f5f5f5"/>

  <!-- lane zones / frame -->
  <line x1="0" y1="60" x2="1260" y2="60" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="0" y1="260" x2="1260" y2="260" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="0" y1="460" x2="1260" y2="460" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="0" y1="660" x2="1260" y2="660" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="160" y1="60" x2="160" y2="660" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- lane labels -->
  <text x="80" y="156" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ลูกค้า</text>
  <text x="80" y="172" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Thai',monospace" text-anchor="middle" letter-spacing="0.08em">CUSTOMER</text>

  <text x="80" y="356" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">พนักงานขาย</text>
  <text x="80" y="372" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Thai',monospace" text-anchor="middle" letter-spacing="0.08em">SALES STAFF</text>

  <text x="80" y="556" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">แผนกบัญชี</text>
  <text x="80" y="572" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Thai',monospace" text-anchor="middle" letter-spacing="0.08em">ACCOUNTING</text>

  <!-- ============ ARROWS (drawn before boxes) ============ -->

  <!-- N1 -> N3 straight vertical -->
  <line x1="280" y1="208" x2="280" y2="304" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N3 -> N4 straight horizontal -->
  <line x1="380" y1="360" x2="412" y2="360" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N4 -> N5 straight horizontal -->
  <line x1="620" y1="360" x2="652" y2="360" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N5 -> N6 straight vertical -->
  <line x1="760" y1="408" x2="760" y2="504" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N6 -> N7 straight horizontal -->
  <line x1="860" y1="560" x2="972" y2="560" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N2 -> N6 rounded elbow (customer pays by mail / transfer, bypassing sales staff) -->
  <path d="M 560,208 L 560,282 Q 560,290 568,290 L 882,290 Q 890,290 890,298
           L 890,482 Q 890,490 882,490 L 828,490 Q 820,490 820,498 L 820,504"
        fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ NODES ============ -->

  <!-- N1: customer with scheduled visit -->
  <rect x="180" y="112" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="142" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ลูกค้ามีนัดเยี่ยม</text>
  <text x="280" y="164" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">จ่ายเงินสด/เช็ค</text>
  <text x="280" y="180" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ตอนพนักงานขายเข้าพบ</text>

  <!-- N2: customer without scheduled visit -->
  <rect x="460" y="112" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="560" y="142" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ลูกค้าไม่มีแผนเยี่ยม</text>
  <text x="560" y="164" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ส่งเช็คไปรษณีย์/EMS</text>
  <text x="560" y="180" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">หรือโอนเงิน + แฟกซ์สลิป</text>

  <!-- N3: sales staff collects payment -->
  <rect x="180" y="312" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="342" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">รับเงินสด/เช็ค</text>
  <text x="280" y="364" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">จากลูกค้าโดยตรง</text>
  <text x="280" y="380" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ระหว่างเข้าเยี่ยม</text>

  <!-- N4: FOCAL / high-risk custody node -->
  <rect x="420" y="312" width="200" height="96" rx="6" fill="#fdece1" stroke="#eb6c36" stroke-width="1.5"/>
  <rect x="552" y="320" width="60" height="16" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="582" y="331" fill="#eb6c36" font-size="8" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle" font-weight="600">เสี่ยงสูง</text>
  <text x="500" y="358" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ถือเงิน/เช็คไว้เอง</text>
  <text x="500" y="378" fill="#8a5233" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ระหว่างออกตลาด</text>
  <text x="500" y="394" fill="#8a5233" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ต่างจังหวัด ~1 เดือน</text>

  <!-- N5: end of month, returns and delivers -->
  <rect x="660" y="312" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="760" y="342" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">สิ้นเดือนกลับบริษัท</text>
  <text x="760" y="364" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ส่งมอบเช็คให้</text>
  <text x="760" y="380" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">พนักงานออกใบกำกับ</text>

  <!-- N6: record & post to AR -->
  <rect x="660" y="512" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="760" y="542" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">บันทึกรับชำระ</text>
  <text x="760" y="564" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">และตัดบัญชี</text>
  <text x="760" y="580" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ลูกหนี้รายตัว</text>

  <!-- N7: update AR aging -->
  <rect x="980" y="512" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1080" y="542" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ปรับปรุงยอด</text>
  <text x="1080" y="564" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ลูกหนี้คงเหลือ</text>
  <text x="1080" y="580" fill="#4f5d75" font-size="10.5" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">(Aging Report)</text>

  <!-- ============ LEGEND ============ -->
  <line x1="20" y1="700" x2="1240" y2="700" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="20" y="694" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Thai',monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="20" y="718" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="48" y="729" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans Thai',sans-serif">ขั้นตอนปกติ</text>

  <rect x="280" y="718" width="20" height="14" rx="3" fill="#fdece1" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="308" y="729" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans Thai',sans-serif">จุดเสี่ยงสูงที่ควรเพ่งตรวจสอบ</text>

  <line x1="600" y1="725" x2="636" y2="725" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="648" y="729" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans Thai',sans-serif">การส่งต่อขั้นตอน</text>

</svg>
  </div>
</body>
</html>
